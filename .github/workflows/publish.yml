# This workflow will upload a Python Package to Release asset
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

name: Create Release

on:
  push:
    tags:
      - v*

# Needed to create release and upload assets
permissions:
  contents: write

jobs:
  release:
    # Retrieve tag and create release
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract branch info
        shell: bash
        run: |
          echo "release_tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Create Release
        id: create_release
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RELEASE_TAG: ${{ env.release_tag }}
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const script = require('.github/workflows/scripts/create_release.js')
            await script(github, context, core)

  verify-provenance:
    name: Verify Release Artifact Provenance
    runs-on: ubuntu-latest
    needs: release
    # The release job above needs `contents: write` to create the release; this job
    # only reads the published tag, its assets, and their signatures, so the minimum
    # `contents: read` scope is enough here.
    permissions:
      contents: read

    steps:
      - name: Extract branch info
        shell: bash
        run: |
          echo "release_tag=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      # Trust flow (English):
      # 1. `cosign` is fetched directly from the official sigstore/cosign GitHub
      #    release, pinned to COSIGN_VERSION below, and its SHA-256 checksum is
      #    verified against the cosign_checksums.txt published in that same release.
      #    This keeps the tool pinned and verifiable without depending on an unpinned
      #    third-party install script.
      # 2. Every `.whl` asset attached to this release (built and pushed by upstream
      #    CI, see the NOTE above) is verified keyless with `cosign verify-blob`
      #    against its Sigstore provenance bundle (`*.sigstore`, produced with OIDC).
      #    The bundle chains to the Sigstore public-good root, proving each wheel is
      #    the exact artifact that upstream signed and not a re-uploaded or tampered
      #    one.
      # 3. A wheel without a `.sigstore` bundle hard-fails the job: releases must not
      #    ship unsigned artifacts.
      #
      # Maintainers: keep COSIGN_VERSION current with
      # https://github.com/sigstore/cosign/releases. Adjust OIDC_CERT_IDENTITY_RE and
      # OIDC_ISSUER so they exactly match the workflow/CI that signs the artifacts,
      # and run this job only after the upstream wheel-upload pipeline has published
      # the assets for the tag (add a `workflow_dispatch` trigger if it must also be
      # re-runnable later).
      - name: Install pinned cosign release binary with checksum verification
        shell: bash
        env:
          COSIGN_VERSION: v2.4.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download --repo sigstore/cosign "$COSIGN_VERSION" \
            --pattern "cosign_${COSIGN_VERSION#v}_linux_amd64.deb" \
            --pattern "cosign_checksums.txt" --clobber
          grep "cosign_${COSIGN_VERSION#v}_linux_amd64.deb$" cosign_checksums.txt > "checksum.cosign.txt"
          sha256sum -c "checksum.cosign.txt"
          sudo dpkg -i "cosign_${COSIGN_VERSION#v}_linux_amd64.deb"
          cosign version

      - name: Download release wheel assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheels"
          gh release download "$release_tag" --pattern "*.whl" --pattern "*.sigstore" --dir "$RUNNER_TEMP/wheels"

      - name: Verify wheel provenance with cosign verify-blob
        shell: bash
        env:
          OIDC_CERT_IDENTITY_RE: '^https://github.com/vllm-project/vllm/.*'
          OIDC_ISSUER: 'https://token.actions.githubusercontent.com'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wheels"
          mapfile -t wheels < <(compgen -G '*.whl' || true)
          if (( ${#wheels[@]} == 0 )); then
            echo "::error::No wheel assets found for tag ${release_tag}; nothing to verify."
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            bundle="${wheel%.whl}.sigstore"
            if [[ ! -f "$bundle" ]]; then
              echo "::error::Missing Sigstore provenance bundle '${bundle}' for '${wheel}'. Refusing unsigned artifact."
              exit 1
            fi
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "$OIDC_CERT_IDENTITY_RE" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --new-bundle-format=true \
              "$wheel"
          done
          echo "Verified ${#wheels[@]} wheel asset(s) against Sigstore provenance."

